name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", "tools/**", "docker/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "shared/**", "tools/**", "docker/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Lint, unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default ("tools platform-tools") fails: the legacy "tools" package no longer exists.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Generated files are up to date
        working-directory: .
        run: |
          python3 tools/generate_strings.py --check
          python3 tools/generate_test_ids.py --check

      - name: ktlint, detekt, Android Lint, unit tests
        run: ./gradlew qualityCheck --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: ignore

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/**/build/reports/
            android/**/build/test-results/
          if-no-files-found: ignore

  instrumented:
    name: Compose UI + UIAutomator tests (emulator, with backend)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The backend for BackendIntegrationTest; the emulator reaches the host at 10.0.2.2:8080.
      - name: Start backend
        run: docker compose up --build --wait --wait-timeout 180 backend

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action's default ("tools platform-tools") fails: the legacy "tools" package no longer exists.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run instrumented tests on an API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  docker:
    name: Docker build image produces an APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build android
      - name: Let the container user write to the mounted checkout
        # On Linux a bind mount keeps the runner's ownership; the image's "builder" user has another UID.
        run: chmod -R a+rwX .
      - name: Quality gate and APK inside the container
        run: docker compose run --rm android
      - name: Upload APK built in Docker
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-docker
          path: android/app/build/outputs/apk/debug/*.apk
