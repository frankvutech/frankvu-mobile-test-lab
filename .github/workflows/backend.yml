name: Backend and API tests

on:
  push:
    branches: [main]
    paths: ["backend/**", "api-tests/**", "docker/backend/**", "docker-compose.yml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "api-tests/**", "docker/backend/**", "docker-compose.yml", ".github/workflows/backend.yml"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-api:
    name: Backend (PostgreSQL) + API automation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI-only values; nothing here is a real secret.
      JWT_SECRET: ci-only-secret-${{ github.run_id }}
      POSTGRES_PASSWORD: ci-only-password
      TEST_SUPPORT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      # 1. Start the backend and its database, 2. wait for the health check.
      - name: Start PostgreSQL and backend
        run: docker compose up --build --wait --wait-timeout 180 backend

      - name: Backend health
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ready

      # 3. Backend unit and integration tests (in-process, H2 in-memory) and static analysis.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend ktlint, detekt, unit and integration tests
        working-directory: backend
        run: ./gradlew ktlintCheck detekt test

      # 4. API automation against the running containerised backend.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api-tests/requirements.txt
      - name: API tests
        working-directory: api-tests
        env:
          API_BASE_URL: http://localhost:8080
        run: |
          pip install -r requirements.txt
          pytest --junitxml=reports/api-tests.xml

      - name: Backend logs
        if: failure()
        run: docker compose logs backend postgres

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-and-api-reports
          path: |
            api-tests/reports/
            backend/build/reports/
            backend/build/test-results/
          if-no-files-found: ignore

      - name: Stop services
        if: always()
        run: docker compose down -v
