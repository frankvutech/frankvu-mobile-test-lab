# Heap capped at 3 GB so the Docker build stays within Docker Desktop's default memory limit.
# Metaspace is generous because KSP, Hilt, the Compose compiler and Android Lint share one daemon.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-download=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 defaults that this project opts out of: it applies the Kotlin Android plugin explicitly and
# uses the classic DSL, which Hilt 2.57 and KSP 2.3 still require.
android.builtInKotlin=false
android.newDsl=false
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
